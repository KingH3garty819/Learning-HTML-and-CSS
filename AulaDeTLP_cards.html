<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards Modernos</title>

    <style>

        *{
            box-sizing: border-box;
        }

        body{
            font-family: monospace;
            background: white;
            margin: 0;
            padding: 30px;
        }

        h1{
            text-align: center;
            color: #1e293b;
        }

        .introducao{
            text-align: center;
            color: #64748b;
            margin-bottom: 35px;
        }

        .container{
            max-width: 1200px;
            margin: auto;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .card{
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 15px;

            transition: all 0.4s ease;
        }

        .card h2{
            color: blue;
        }

        .card p{
            color: gray;
            line-height: 1.6;
        }

        .cl{
            box-shadow: 0 4px 10px black;
        }

        .cl:hover{
            transform: translateY(-10px);
        }

        .card2{
            box-shadow: 0 4px 10px black;
        }

        .c2:hover{
            transform: translateY(10px);
        }

        

    </style>

</head>

<body>
    



</body>

</html>
