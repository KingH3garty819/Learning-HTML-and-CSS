<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projecto Completo de CSS</title>

    <style>
        
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html{
            scroll-behavior: smooth;
        }

        body{
            color: #1e293b;
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f1f5f9;
        }

        img{
            max-width: 100%;
            display: block;
        }

        a{
            text-decoration: none;
        }

        .container{
            width: 90%;
            max-width: 1100px;
            margin: auto;
        }

        section{
            padding: 55px 0;
            scroll-margin-top: 80px;
        }

        .titulo{
            margin-bottom: 30px;
            text-align: center;
            font-size: 30px;
        }

        .descricao{
            text-align: center;
            margin: -15px auto 30px;
            max-width: 650px;
            color: #64748b;
        }



        .site{
            display: grid;
            grid-template-areas:
            "header"
            "nav"
            "conteudo"
            "footer";

            grid-template-columns: 1fr;
            min-height: 100vh;
        }

        header{
            grid-area: header;
        }

        nav{
            grid-area: nav;
        }

        main{
            grid-area: conteudo;
        }

        footer{
            grid-area: footer;
        }

        /*CABECALHO E GRADIENTE*/

        .cabecalho{
            background-image: 
            radial-gradient(
                circle at top right,
                rgba(255, 255, 255, 0.25),
                transparent 35%
             ),
             linear-gradient(
                135deg,
                #0f172a,
                #2563eb,
                #7c3aed
             );

             color: white;
             text-align: center;
             padding: 65px 20px,
        }

        .cabecalho h1{
            font-size: clamp(28px, 5vw, 45px);
            margin-bottom: 10px;
        }

        .cabecalho p{
            font-size: 17px;
        }

        /*MENU DE NAVEGACAO*/

        .menu{
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 5px;
            padding: 12px;
        }

        .menu a{
            color: white;
            padding: 10px 15px;
            border-radius: 6px;

            transition:
             background-color 0.3s ease,
             color 0.3s ease;
        }

        .menu a:hover{
            background-color: #2563eb;
            color: #ffffff;
        }

        /*CARDS MODERNOS*/

        .cards{
            display: grid;
            grid-template-columns: 
            repeat(3, minmax(0, 1fr));

            gap: 25px;
        }

        .card{
            background-color: white;
            border-radius: 15px;
            overflow: hidden;

            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);

            transition: transform 0.3s ease,
             box-shadow 0.3s ease;
        }

        .card:hover{
            transform: translateY(-8px);

            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.16);
        }

        .imagem-card{
            height: 180px;

            background-image:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #2563eb,
                    #9333ea
                );

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .imagem-verde{
            background-image:
                linear-gradient(
                    135deg,
                    #059669,
                    #a3e635
                );
        }

        .imagem-laranja{
            linear-gradient(
                135deg,
                #ea580c,
                #facc15
            );
        }

        .conteudo-card{
            padding: 22px;
        }

        .categoria{
            color: #2563eb;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .conteudo-card h3{
            margin: 10px 0;
            font-size: 21px;
        }

        .conteudo-card p{
            color: #64748b;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .botao{
            display: inline-block;
            padding: 10px 18px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;

            transition:
            background-color 0.3s ease,
            transform 0.3s ease;
        }

        .botao:hover{
            background-color: #7c3aed;
            transform: scale(1.05);
        }

        /*COLUMNS: TEXTO EM COLUNAS*/

        .texto-colunas p{
            margin-bottom: 15px;
            text-align: justify;
        }

        /*DEMONSTRACAO DE GRADIENTES*/

        .gradientes{
            display: grid;
            grid-template-columns:
            repeat(3, minmax(0, 1fr));

            gap: 20px;
        }

        .gradiente{
            min-height: 150px;
            border-radius: 14px;
            padding: 20px;

            display:flex;
            justify-content: center;
            align-items: center;

            color: white;
            font-weight: bold;
            font-align: center;

            box-shadow: 0 5px 15px #0002;
        }

        .linear{
            background: linear-gradient(
                to right,
                #2563eb,
                #9333ea
            );
        }

        .radial{
            background: radial-gradient(
                circle,
                #fef08a,
                #f97316,
                #991b1b
            );
        }

        .conico{
            background: conic-gradient(
                #ef4444,
                #facc15,
                #22c55e,
                #3b82f6,
                #9333ea,
                #ef4444
            ),
        }

        /*MULTIPLOS BACKGROUNDS*/

        .background-duplo{
            min-height: 220px;
            border-radius: 16px;
            padding: 35px;
            color: white;

            background-image:
                radial-gradient(
                    circle at top right,
                    rgba(255, 255, 255, 0.4),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #0f172a,
                    #2563eb,
                    #7c3aed
                );

                background-repeat:
                no-repeat,
                no-repeat;

                background-position:
                right top,
                center;

                background-size:
                cover,
                cover;

                box-shadow: 0 8px 25px #0002;
        }

        /*ANIMACOES COM KEYFRAMES*/

        .caixa-animada{
            width: 80px;
            height: 80px;
            border-radius: 15px;
            background: linear-gradient(
                135deg,
                #2563eb,
                #9333ea
            );

            animation: mover 3s ease-in-out
                infinite alternate;
        }

        @keyframes mover{
            from{
                transform: translateX(0);
            }to{
                transform: translateX(180px)
            }
        }

        .entrada{
            animation: aparecer 1s ease-out;
        }

        @keyframes aparecer{
            from{
                opacity: 0;
                transform: translateY(25px);
            }to{
                opacity: 1;
                transform: translateY(0);
            }
        }

        /*EXEMPLO DE SOMBRAS*/

    </style>

</head>

<body>


    
</body>

</html>
