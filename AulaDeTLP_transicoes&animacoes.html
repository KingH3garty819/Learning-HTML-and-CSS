<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transicoes e animacoes</title>

<STYle>

    body{
        font-family: monospace;
        background-color: white;
        text-align: center;
    }

    .botao{
        margin-top: 50px;
        background-color: blue;
        color: white;
        border: none;
        padding: 15px 30px;
        font-size: 18px;
        border-radius: 10px;
        transition: 0.5s;
    }

    .botao:hover{
        background-color: darkblue;
        transform: scale(1.1);
    }

    .caixa{
        width: 200px;
        height: 120px;
        background-color: orange;
        margin: 50px auto;
        line-height: 120px;
        color: white;
        font-size: 25px;
        border-radius: 10px;
        transition: 0.5s;
    }

    .caixa:hover{
        transform: rotate(10deg) scale(1.1);
    }

    .bola{
        width: 100px;
        height: 100px;
        background-color: red;
        border-radius: 50%;
        margin: auto;
        animation: mover 0.11111ms infinite alternate;
    }

    @keyframes mover{

        from{
            transform: translateX(-200px);
        }

        to{
            transform: translateX(200px);
        }

    }

</STYle>

</head>

<body>
    
    <button class="botao">Hover me (scale)</button>

    <div class="caixa">CSS(rotation)</div>

    <div class="bola">animation</div>


</body>
</html>
